plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
    alias libs.plugins.ksp
    id("kotlin-parcelize")
}

android {
    namespace "ru.radiationx.data"

    compileSdk app_compile_sdk_version

    defaultConfig {
        minSdk app_min_sdk_version
        targetSdk app_target_sdk_version
    }

    sourceSets {
        test {
            java.srcDirs += "src/liveTest/java"
            resources.srcDirs += "src/liveTest/resources"
        }
    }
}

kotlin {
    jvmToolchain(jvm_toolchain_version)
}

dependencies {
    implementation project(":shared-android-ktx")
    implementation project(":quill-di")

    api(platform(libs.okhttp.bom))
    api(libs.okhttp)
    api(libs.okhttp.logging.interceptor)
    api(libs.okhttp.urlconnection)

    debugImplementation libs.chucker
    releaseImplementation libs.chucker.noop

    api libs.kotlin.coroutines.core

    implementation libs.kotlin.stdlib

    api libs.minitemplator

    api libs.timber

    api libs.conscrypt.android

    api libs.moshi
    api libs.moshi.adapters
    ksp libs.moshi.compiler

    implementation libs.media3.exoplayer
    implementation libs.media3.datasource.okhttp
    implementation libs.media3.datasource.cronet

    compileOnly libs.toothpick
    ksp libs.toothpick.compiler

    implementation libs.androidnetworktools
    implementation libs.androidx.security.crypto

    testImplementation "junit:junit:4.13.2"
    testImplementation "io.mockk:mockk:1.13.13"
}

tasks.withType(Test).configureEach {
    if (name != "liveApiTest") {
        exclude("**/*LiveContractTest.class")
    }
}

tasks.register("liveApiTest", Test) {
    group = "verification"
    description = "Runs AniLiberty live internet contract tests only."
    dependsOn("testDebugUnitTest")

    def debugUnitTest = tasks.named("testDebugUnitTest", Test).get()
    testClassesDirs = debugUnitTest.testClassesDirs
    classpath = debugUnitTest.classpath
    include("**/*LiveContractTest.class")

    environment("ANILIBERTY_LIVE_TESTS", System.getenv("ANILIBERTY_LIVE_TESTS") ?: "1")
    if (System.getenv("ANILIBERTY_BASE_URL") != null) {
        environment("ANILIBERTY_BASE_URL", System.getenv("ANILIBERTY_BASE_URL"))
    }
    shouldRunAfter("testDebugUnitTest")

    testLogging {
        events("passed", "failed", "skipped")
        showStandardStreams = true
    }
}
