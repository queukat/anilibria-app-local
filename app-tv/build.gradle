static def getDateTime() {
    DateFormat df = new SimpleDateFormat("dd MMMMM yyyy")
    return df.format(new Date()) + " г."
}

static def resolveSigningProperty(Project project, String key) {
    def fromEnv = System.getenv(key)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv
    }
    def fromGradle = project.findProperty(key)?.toString()
    if (fromGradle != null && !fromGradle.trim().isEmpty()) {
        return fromGradle
    }
    return null
}

android {
    namespace = "ru.radiationx.anilibria"

    compileSdk = app_compile_sdk_version
    def androidUserHome = System.getenv("ANDROID_USER_HOME") ?: "${System.getProperty("user.home")}/.android"
    def debugStoreFile = file("${androidUserHome}/debug.keystore")
    def hasDebugSigning = debugStoreFile.exists()

    def releaseStoreFile = resolveSigningProperty(project, "RELEASE_STORE_FILE")
    def releaseStorePassword = resolveSigningProperty(project, "RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = resolveSigningProperty(project, "RELEASE_KEY_ALIAS")
    def releaseKeyPassword = resolveSigningProperty(project, "RELEASE_KEY_PASSWORD")
    def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
            .every { it != null && !it.trim().isEmpty() }

    defaultConfig {
        applicationId = "ru.radiationx.anilibria.app.tv"
        minSdk = Math.max(tv_min_sdk_version as int, 23)
        targetSdk = app_target_sdk_version
        versionCode = tv_version_code
        versionName = tv_version_name
        testInstrumentationRunner = "ru.radiationx.anilibria.test.TvInstrumentationRunner"
        buildConfigField "String", 'BUILD_DATE', '"' + getDateTime() + '"'
    }

    buildFeatures {
        compose = true
        viewBinding = true
        buildConfig = true
    }

    signingConfigs {
        if (hasDebugSigning) {
            debug {
                storeFile = debugStoreFile
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasDebugSigning) {
                signingConfig = signingConfigs.debug
            }
        }
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def appName = "AniLibria_TV"
            def versionName = variant.versionName
            outputFileName = "${appName}_v${versionName}.apk"
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/libconscrypt_jni.so"]
        }
    }

    testOptions {
        managedDevices {
            devices {
                pixel2Api33(ManagedVirtualDevice) {
                    device = "Pixel 2"
                    apiLevel = 33
                    systemImageSource = "google_apis"
                }
            }
        }
    }
}

kotlin {
    jvmToolchain(jvm_toolchain_version)
