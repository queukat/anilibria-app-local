// ---------- utility ----------

import java.text.DateFormat
import java.text.SimpleDateFormat
import java.util.Date
import io.gitlab.arturbosch.detekt.Detekt

static String buildDate() {
    DateFormat df = new SimpleDateFormat("dd MMMM yyyy", Locale.US)
    return df.format(new Date()) + " г."
}

static String resolveSigningProperty(Project project, String key) {
    def fromEnv = System.getenv(key)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv
    }
    def fromGradle = project.findProperty(key)?.toString()
    if (fromGradle != null && !fromGradle.trim().isEmpty()) {
        return fromGradle
    }
    return null
}

static File resolveSigningFile(Project project, String pathValue) {
    if (pathValue == null || pathValue.trim().isEmpty()) {
        return null
    }

    def direct = project.file(pathValue)
    if (direct.exists()) {
        return direct
    }

    // Support legacy root-style values like "\keystore.jks" by also checking the repo root.
    if (pathValue.startsWith("\\") || pathValue.startsWith("/")) {
        def repoRelative = project.rootProject.file(pathValue.substring(1))
        if (repoRelative.exists()) {
            return repoRelative
        }
    }

    return direct
}

