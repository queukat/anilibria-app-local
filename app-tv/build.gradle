// ---------- android ----------

android {
    namespace "ru.radiationx.anilibria"

    compileSdk app_compile_sdk_version

    def androidUserHome = System.getenv("ANDROID_USER_HOME") ?: "${System.getProperty("user.home")}/.android"
    def debugStoreFile = file("${androidUserHome}/debug.keystore")
    def hasDebugSigning = debugStoreFile.exists()

    def releaseStorePath = resolveSigningProperty(project, "RELEASE_STORE_FILE")
    def releaseStoreFile = resolveSigningFile(project, releaseStorePath)
    def releaseStorePassword = resolveSigningProperty(project, "RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = resolveSigningProperty(project, "RELEASE_KEY_ALIAS")
    def releaseKeyPassword = resolveSigningProperty(project, "RELEASE_KEY_PASSWORD")
    def hasReleaseSigning = releaseStoreFile?.exists() &&
            [releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
                    .every { it != null && !it.trim().isEmpty() }

    defaultConfig {
        applicationId "ru.radiationx.anilibria.app.tv"
        minSdk tv_min_sdk_version
        targetSdk app_target_sdk_version
        versionCode tv_version_code
        versionName tv_version_name

        buildConfigField "String", "BUILD_DATE", "\"${buildDate()}\""
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        if (hasDebugSigning) {
            debug {
                storeFile = debugStoreFile
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
        if (hasReleaseSigning) {
            release {
                storeFile = releaseStoreFile
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasDebugSigning) {
                signingConfig = signingConfigs.debug
            }
        }
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            } else if (hasDebugSigning) {
                signingConfig = signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                def appName = "AniLibria_TV"
                def versionStr = output.versionName.get()
                output.outputFileName.set("${appName}_${variant.name}_v${versionStr}.apk")
            }
        }
    }
}

kotlin {
    jvmToolchain(jvm_toolchain_version)
}

detekt {
    buildUponDefaultConfig = true
    allRules = false
    ignoreFailures = false
    config.setFrom(files("${rootProject.projectDir}/config/detekt/detekt.yml"))
    basePath = rootProject.projectDir.absolutePath
}

tasks.withType(Detekt).configureEach {
    jvmTarget = jvm_toolchain_version.toString()
    setSource(files("src"))
    include("**/*.kt")
    include("**/*.kts")
    exclude("**/build/**")
    exclude("**/generated/**")
}

ktlint {
    android.set(true)
    ignoreFailures.set(false)
    filter {
        exclude("**/build/**")
        exclude("**/generated/**")
    }
}

tasks.named("check").configure {
    dependsOn("detekt")
}

