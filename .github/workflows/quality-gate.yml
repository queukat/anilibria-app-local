name: Quality Gate

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  android-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Unit Tests and Assemble
        run: |
          ./gradlew :data:testDebugUnitTest :app-tv:testDebugUnitTest :app-tv:assembleDebug --console=plain --stacktrace
